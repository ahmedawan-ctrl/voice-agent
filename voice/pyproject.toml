[project]
name = "voice-agent"
version = "0.1.0"
description = "Production-level AI voice agent using Kyutai models and Pipecat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # In [project].dependencies
    "torch",
    "torchvision",
    "torchaudio",
    "pipecat-ai[daily,silero,websocket]>=0.0.49",
    "moshi>=0.2.6",
    "numpy>=1.24.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9.0",
    "huggingface-hub>=0.20.0",
    "ollama>=0.1.0",
    "pyaudio>=0.2.14",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]